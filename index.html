<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>PASSWORD GENERATOR</h1>
      <div class="password-display">
        <div id="password">PASSWORD</div>
        <button id="copy-btn"><img src="th.jpg" alt="Copy" /></button>
      </div>
      <div class="length-slider">
        <label for="length">Password Length</label>
        <input type="range" id="length" min="8" max="20" value="10" />
        <span id="length-value">10</span>
      </div>
      <div class="checkboxes">
        <label
          ><input type="checkbox" id="uppercase" /> Includes Uppercase
          letters</label
        >
        <label
          ><input type="checkbox" id="lowercase" /> Includes Lowercase
          letters</label
        >
        <label><input type="checkbox" id="numbers" /> Includes Numbers</label>
        <label><input type="checkbox" id="symbols" /> Includes Symbols</label>
      </div>
      <div class="strength-indicator">
        <label>Strength</label>
        <div class="strength-circle"></div>
      </div>
      <button id="generate">GENERATE PASSWORD</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
